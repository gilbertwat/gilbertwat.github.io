<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}{% if site.author.links %},
    "sameAs": {{ site.author.links | map: 'url' | jsonify }}{% endif %}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }}
  },
  "url": {{ page.url | absolute_url | replace: '/index.html', '/' | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }}{% if page.last_modified_at %},
  "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }}{% endif %},
  "description": {{ page.excerpt | default: page.description | default: site.description | strip_html | normalize_whitespace | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | replace: '/index.html', '/' | jsonify }}
  }{% if page.tags %},
  "keywords": {{ page.tags | join: ", " | jsonify }}{% endif %}
}
</script>
